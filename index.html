<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0e0e10;
      --fg: #f5f1ea;
      --accent: #c6a15b;
      --muted: rgba(245, 241, 234, 0.55);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(198, 161, 91, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(120, 90, 200, 0.14), transparent 55%);
      filter: blur(10px);
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 1.2s ease 0.2s forwards;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.7);
      animation: pulse 2.4s ease-out infinite;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 1.4s ease 0.5s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .tagline {
      margin-top: 2rem;
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1.4s ease 0.9s forwards;
    }

    footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1.4s ease 1.3s forwards;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.6); }
      70%  { box-shadow: 0 0 0 14px rgba(198, 161, 91, 0); }
      100% { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .eyebrow, h1, .tagline, footer { opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow"><span class="dot"></span>operativo</span>
    <h1>Ya<br/><em>funcionó bien.</em></h1>
    <p class="tagline">Todo listo. Todo en su lugar.</p>
  </main>
  <footer>— 2026</footer>
</body>
</html>
